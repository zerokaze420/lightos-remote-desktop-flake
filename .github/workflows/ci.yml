name: Nix flake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Check and build flake
        run: nix flake check --impure
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
      - name: Run packaged binary
        run: nix run --impure . -- --version
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
